name: End-to-end

# Builds the image (including Block's Buzz tools), starts a real Buzz relay,
# the bridge and a mock Grok Bot, and asks questions. Slow, so it runs on
# demand, weekly, and before releases.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Build the bridge image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: grokbot-buzz-bridge:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the end-to-end test
        run: test/e2e/run.sh --down
