name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Shell scripts parse
        run: bash -n scripts/preflight.sh test/e2e/run.sh test/e2e/s3-init.sh
      - name: Compose files are valid
        run: |
          cp .env.example deploy/.env
          docker compose -f deploy/compose.yml config -q
          E2E_OWNER_PUBKEY=x E2E_RELAY_SECRET=x docker compose -f test/e2e/compose.yml config -q
